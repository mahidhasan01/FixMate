{% extends 'base.html' %}

{% block title %}Edit review - FixMate{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card">
                <div class="card-body p-4">
                    <h1 class="h3 mb-1">Edit review</h1>
                    <p class="text-body-secondary mb-4">{{ review.booking.service.title }}</p>

                    <form method="post">
                        {% csrf_token %}
                        {% include 'partials/_form_fields.html' %}
                        <button type="submit" class="btn btn-primary">Save changes</button>
                        <a href="{% url 'booking_app:booking_detail' review.booking.pk %}" class="btn btn-outline-primary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
