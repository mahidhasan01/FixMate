{% extends 'base.html' %}

{% block title %}Send completion photo - FixMate{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card">
                <div class="card-body p-4">
                    <h1 class="h3 mb-1">Send completion photo</h1>
                    <p class="text-body-secondary mb-4">{{ booking.service.title }} &middot; {{ booking.booking_date|date:'d M Y' }}</p>

                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {% include 'partials/_form_fields.html' %}
                        <button type="submit" class="btn btn-primary">Send photo</button>
                        <a href="{% url 'booking_app:booking_detail' booking.pk %}" class="btn btn-outline-primary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
