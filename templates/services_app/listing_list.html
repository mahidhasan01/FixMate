{% extends 'base.html' %}

{% block title %}Find services - FixMate{% endblock %}

{% block content %}
    <h1 class="h3 mb-4">Find services</h1>

    <form method="get" class="card card-body mb-4">
        <div class="row g-2 align-items-end">
            <div class="col-md-4">
                <label for="q" class="form-label">Search</label>
                <input type="search" id="q" name="q" value="{{ q }}" class="form-control" placeholder="e.g. tap, wiring, AC">
            </div>
            <div class="col-md-3">
                <label for="category" class="form-label">Category</label>
                <select id="category" name="category" class="form-select">
                    <option value="">All categories</option>
                    {% for cat in categories %}
                        <option value="{{ cat.pk }}" {% if category == cat.pk|stringformat:'s' %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label for="min_price" class="form-label">Min price (৳)</label>
                <input type="number" id="min_price" name="min_price" value="{{ min_price }}" min="0" class="form-control">
            </div>
            <div class="col-6 col-md-2">
                <label for="max_price" class="form-label">Max price (৳)</label>
                <input type="number" id="max_price" name="max_price" value="{{ max_price }}" min="0" class="form-control">
            </div>
            <div class="col-md-1 d-grid">
                <button type="submit" class="btn btn-warning">Search</button>
            </div>
        </div>
    </form>

    <div class="row g-4">
        {% for listing in listings %}
            <div class="col-md-6 col-lg-4">
                {% include 'partials/_listing_card.html' %}
            </div>
        {% empty %}
            <p class="text-body-secondary">No listings found. Try a different search.</p>
        {% endfor %}
    </div>
{% endblock %}
