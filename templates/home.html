{% extends 'base.html' %}

{% block title %}FixMate - Home{% endblock %}

{% block hero %}
    <section class="hero text-center">
        <div class="container">
            <h1 class="hero-title" lang="bn">ভাই, ভালো একজন মিস্ত্রি চেনেন?</h1>
            <p class="lead mb-3">Book verified electricians, plumbers and technicians near you.</p>

            <form method="get" action="{% url 'services_app:listing_list' %}" role="search" class="tw-max-w-xl tw-mx-auto">
                <div class="input-group input-group-lg">
                    <input type="search" name="q" class="form-control"
                           placeholder="What needs fixing?" aria-label="Search services">
                    <button type="submit" class="btn btn-warning">
                        <i class="bi bi-search"></i> Search
                    </button>
                </div>
            </form>

            <ul class="list-unstyled d-flex flex-wrap justify-content-center tw-gap-x-8 tw-gap-y-2 mt-3 mb-0">
                <li><i class="bi bi-shield-check"></i> ID-verified workers</li>
                <li><i class="bi bi-camera"></i> Photo proof on every job</li>
                <li><i class="bi bi-star"></i> Public ratings</li>
            </ul>
        </div>
    </section>
{% endblock %}
