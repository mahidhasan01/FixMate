{% extends 'base.html' %}

{% block title %}Log in - FixMate{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Log in</h1>

                    <form method="post">
                        {% csrf_token %}
                        {% include 'partials/_form_fields.html' %}
                        <button type="submit" class="btn btn-primary w-100">Log in</button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        New to FixMate? <a href="{% url 'accounts_app:choose_role' %}">Create an account</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
