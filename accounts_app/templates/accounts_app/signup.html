{% extends 'base.html' %}

{% block title %}Sign up as a {{ role }} - FixMate{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card">
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Sign up as a {{ role }}</h1>

                    <form method="post">
                        {% csrf_token %}
                        {% include 'partials/_form_fields.html' %}
                        <button type="submit" class="btn btn-primary w-100">Create account</button>
                    </form>

                    <p class="text-center mt-3 mb-0">
                        Already have an account? <a href="{% url 'accounts_app:login' %}">Log in</a>
                    </p>
                    <p class="text-center mt-2 mb-0">
                        <a href="{% url 'accounts_app:choose_role' %}">Choose a different role</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
